r-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.back{width:34px;height:34px;border:1px solid #3b4b66;border-radius:12px;background:#172338;font-size:18px}.pagehead h2{font-size:17px;margin:0 0 3px}.pagehead p{margin:0;color:var(--muted);font-size:11px}.chatlist{padding:10px}.chatrow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #222e42;padding:13px 7px}.avatar{width:44px;height:44px;flex-shrink:0;border-radius:15px;background:linear-gradient(145deg,#344d70,#1a263a);border:1px solid #4a6285;display:grid;place-items:center;color:#dce8fc;font-weight:700;font-size:13px}.chatmeta{min-width:0;flex:1}.chatname{font-size:13px;font-weight:650;margin-bottom:5px}.preview{font-size:11px;color:#9eacc1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#7f90a8;align-self:flex-start}.thread{padding:13px 12px 22px}.thread-date{text-align:center;font-size:10px;color:#788aa4;margin:10px 0 17px}.bubbleline{display:flex;margin:9px 0;align-items:flex-end;gap:7px}.bubbleline.me{justify-content:flex-end}.bubble{max-width:82%;border:1px solid #293a53;background:#1b293d;border-radius:16px 16px 16px 5px;padding:10px 12px;font-size:12px;line-height:1.65;white-space:pre-line}.me .bubble{background:#31527b;border-color:#476a96;border-radius:16px 16px 5px 16px}.bubble small{display:block;color:#a8b7cc;font-size:9px;margin-top:5px}.choicebox{margin:17px 0 3px;border-top:1px solid #2a3951;padding-top:15px}.choicebox h3{font-size:12px;color:#d7e4f8;margin:0 0 10px}.choice{width:100%;text-align:left;border:1px solid #354760;background:#151f30;border-radius:13px;padding:12px 13px;margin:5px 0;font-size:12px;line-height:1.5;transition:.15s}.choice:active{transform:scale(.985);background:#223652}.choice .num{color:var(--blue);margin-right:8px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.photo{border:1px solid #34445c;background:#151e2d const initialState={page:'home',thread:null,unlocked:{messages:true,photos:false,social:true,notes:true,calls:false,mail:false,calendar:false,files:false},clues:[],trust:50,exposure:15,publicOpinion:50,choices:[],stage:0,read:{},ending:null};
let state;try{state={...initialState,...JSON.parse(localStorage.getItem('anotherLifeSave')||'{}')};}catch(e){state={...initialState}}
function save(){localStorage.setItem('anotherLifeSave',JSON.stringify(state))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;el.className='toast';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2300)}

function app(icon,cls,name,page){return `<button class="app" onclick="go('${page}')"><span class="appicon ${cls}">${icon}</span><span>${name}</span></button>`}

const threads={
leeteuk:{title:'利特',desc:'私人訊息 · 已加密備份',msgs:[['other','妳到家了嗎？今天的事，先不要讓其他人知道。','01:47'],['me','你是誰？這支手機是我撿到的。','01:48'],['other','……撿到？妳現在在哪裡？','01:48'],['other','先不要交給工作人員。拜託。','01:49']],choices:[{text:'回覆：我在場館外的便利商店。',effect:{trust:8,exposure:0,clue:'leeteuk'},next:'reply'},{text:'先不回覆，查看其他訊息。',effect:{trust:-2,exposure:0,clue:'silence'},next:'wait'},{text:'立刻把手機交給場館工作人員。',effect:{trust:-10,exposure:8,clue:'handover'},next:'handover'}]},

yesung:{title:'藝聲',desc:'私人訊息 · 昨日 22:41',msgs:[['other','我看過那張照片了。','22:41'],['other','照片的時間戳記是 23:12，但那時候我們都在舞台上。','22:42'],['other','可能是轉傳過，也可能有人動過檔案。','22:42']],choices:[{text:'前往相簿比對照片時間。',effect:{trust:2,exposure:0,clue:'timestamp'},next:'photos'},{text:'問他是否懷疑有人故意造假。',effect:{trust:4,exposure:1,clue:'yesung'},next:'ask'}]},
shindong:{title:'神童',desc:'私人訊息 · 昨日 21:50',msgs:[['other','如果你有原始檔，不要只看截圖。','21:50'],['other','截圖能改，原始檔的建立時間和轉存紀錄比較有用。','21:51']],choices:[{text:'記下檔案線索。',effect:{trust:3,exposure:0,clue:'metadata'},next:'save'},{text:'請他幫忙檢查檔案。',effect:{trust:6,exposure:2,clue:'shindong'},next:'ask'}]},
eunhyuk:{title:'銀赫',desc:'私人訊息 · 今日 00:12',msgs:[['other','哥今天根本沒回宿舍。','00:12'],['other','他說要去拿一份東西，叫我們不要等。','00:13'],['other','我不知道他去了哪裡。真的。','00:13']],choices:[{text:'查看行事曆的行程。',effect:{trust:3,exposure:0,clue:'schedule'},next:'calendar'},{text:'問銀赫是不是在幫他隱瞞。',effect:{trust:-1,exposure:1,clue:'eunhyuk'},next:'ask'}]},
donghae:{title:'東海',desc:'私人訊息 · 昨日 23:59',msgs:[['other','有些照片，不是你想的那樣。','23:59'],['other','我答應過不說，所以不能直接告訴你。','00:00'],['other','但你可以看看相簿裡那張沒有上傳的照片。','00:01']],choices:[{text:'查看相簿中的隱藏照片。',effect:{trust:4,exposure:0,clue:'hiddenphoto'},next:'photos'},{text:'尊重他的承諾，暫時不追問。',effect:{trust:5,exposure:-1,clue:'respect'},next:'wait'}]},
siwon:{title:'始源',desc:'私人訊息 · 今日 00:34',msgs:[['other','如果有人問起今晚的行程，統一說法是團體練習。','00:34'],['other','不管看到什麼，都先不要在網路上回應。','00:35'],['other','我們需要知道照片是從哪裡流出去的。','00:35']],choices:[{text:'詢問公關的危機處理計畫。',effect:{trust:5,exposure:-2,clue:'pr'},next:'ask'},{text:'先到韓網確認爆料內容。',effect:{trust:0,exposure:4,clue:'rumor'},next:'social'}]},

group:{title:'SJ｜群組',desc:'9 人群組 · 7 則未讀',msgs:[['other','希澈：隊長，你最好解釋一下。','00:58'],['other','銀赫：現在不是說這個的時候吧。','00:58'],['other','始源：所有人先不要回覆任何陌生訊息。','00:59'],['other','圭賢：所以照片裡的人到底是誰？','01:00'],['other','利特：明天再談。今晚先到這裡。','01:01']],choices:[{text:'查看利特的私人訊息。',effect:{trust:1,exposure:0,clue:'group'},next:'leeteuk'},{text:'保存群組對話作為線索。',effect:{trust:0,exposure:0,clue:'groupchat'},next:'save'}]}

function messages(){if(state.thread)return threadPage(state.thread);return `${head('訊息','私人對話與群組紀錄')}<div class="chatlist">${characters.map(c=>`<button class="chatrow" onclick="openThread('${c.id}')"><span class="avatar" style="background:linear-gradient(145deg,${c.color},#111827)">${c.initial}</span><span class="chatmeta"><span class="chatname">${c.name} <span class="small">${c.sub}</span></span><span class="preview">${c.preview}</span></span><span class="time">${c.id==='leeteuk'?'01:47':'昨日'}</span></button>`).join('')}</div>`}
function openThread(id){state.thread=id;state.page='messages';state.read[id]=true;render();save()}
function threadPage(id){let t=threads[id];if(!t)return '';return `${head(t.title,t.desc)}<div class="thread"><div class="thread-date">2026年10月23日 · 訊息已同步</div>${t.msgs.map(m=>`<div class="bubbleline ${m[0]==='me'?'me':''}"><div class="bubble">${escapeHtml(m[1])}<small>${m[2]} ${m[0]==='me'?'✓✓':''}</small></div></div>`).join('')}<div class="choicebox"><h3>你要怎麼做？</h3>${t.choices.map((c,i)=>`<button class="choice" onclick="choose('${id}',${i})"><span class="num">0${i+1}</span>${c.text}</button>`).join('')}</div></div>`}
function choose(id,i){const c=threads[id].choices[i];applyEffect(c.effect);state.choices.push(id+':'+i);if(c.next==='reply'){state.clues.push('leeteuk');toast('已保存線索：利特正在等待回覆。');state.page='messages';state.thread='leeteuk';threads.leeteuk.msgs.push(['me','我在場館外的便利商店。','01:50'],['other','好。請待在明亮的地方，我會想辦法聯絡妳。','01:51']);}else if(c.next==='handover'){state.ending='handover';state.page='ending';state.thread=null;}else if(c.next==='photos'||c.next==='social'||c.next==='notes'||c.next==='calendar'){state.page=c.next;state.thread=null;toast('線索已記錄。請交叉比對其他資料。')}else{state.thread=id;toast(c.next==='wait'?'你決定暫時觀察。':'已保存對話，新的線索已加入調查。')}state.stage=Math.max(state.stage,1);save();render()}
function applyEffect(e){state.trust=Math.max(0,Math.min(100,state.trust+(e.trust||0)));state.exposure=Math.max(0,Math.min(100,state.exposure+(e.exposure||0)));if(e.clue&&!state.clues.includes(e.clue))state.clues.push(e.clue);if(state.clues.length>=3)state.unlocked.photos=true;if(state.clues.length>=4)state.unlocked.files=true}
function photos(){return `${head('相簿','最近項目 · 18 張照片')}<div class="photo-grid"><button class="photo" onclick="photoDetail(0)"><div class="photo-art"><span>🌃</span></div><div class="photo-caption">凌晨的首爾街景<small>23:12 · 未上傳</small></div></button><button class="photo" onclick="photoDetail(1)"><div class="photo-art" style="background:linear-gradient(140deg,#614f67,#17253b)"><span>🪪</span></div><div class="photo-caption">後台通行證<small>23:09 · 已編輯</small></div></button><button class="photo" onclick="photoDetail(2)"><div class="photo-art" style="background:linear-gradient(140deg,#7b6552,#202c3d)"><span>☕</span></div><div class="photo-caption">兩杯外帶咖啡<small>22:58 · 私人相簿</small></div></button><button class="photo" onclick="photoDetail(3)"><div class="photo-art" style="background:linear-gradient(140deg,#364c69,#151a29)"><span>📍</span></div><div class="photo-caption">沒有標記的地點<small>23:14 · 定位已關閉</small></div></button></div><div class="section"><div class="card"><div class="notif-title">相簿提示</div><div class="small">部分照片的時間與團體行程可能不一致。點開照片查看詳細紀錄，並與訊息中的說法交叉比對。</div></div></div>`}
function photoDetail(i){const details=[['凌晨的首爾街景','照片建立時間：23:12\n最後修改：23:46\n備註：玻璃反光中似乎有第二個人影。','timestamp'],['後台通行證','照片建立時間：23:09\n最後修改：00:11\n備註：照片上的日期被裁切，檔案曾被轉存。','metadata'],['兩杯外帶咖啡','照片建立時間：22:58\n備註：其中一杯的杯套寫著「回家再說」。\n位置：首爾市中心（模糊定位）','hiddenphoto'],['沒有標記的地點','照片建立時間：23:14\n定位：已關閉\n備註：與行事曆中的私人行程時間接近。','schedule']][i];if(!state.clues.includes(details[2]))state.clues.push(details[2]);if(state.clues.length>=3)state.unlocked.photos=true;save();renderModal('照片詳細資訊',details[1],()=>{state.page='photos';render()})}
function renderModal(title,txt,done){screen.innerHTML=`${head(title,'檔案資訊')}<div class="note"><h3>${title}</h3><p>${escapeHtml(txt)}</p></div><div class="section"><button class="primary" onclick="go('notes');addNote('${title.replace(/'/g,"\\'")}')">將線索記入備忘錄</button><button class="primary" onclick="go('photos')">返回相簿</button></div>`}
function social(){return `${head('四大韓網','匿名社群 · 趨勢監測')}<div class="feed"><div class="post"><div class="posttop"><strong>THEQOO · HOT</strong><span class="pill">討論中</span></div><p>【疑似後台目擊】有人說昨晚在場館附近看見一名戴帽子的男子。照片模糊，尚無法確認身分。</p><div class="postfoot"><span>留言 2,481</span><span>轉傳 918</span></div></div><div class="post"><div class="posttop"><strong>DC INSIDE · 匿名版</strong><span class="pill">新帖</span></div><p>行程時間對不上。有人能確認團體結束彩排的時間嗎？不要只看轉傳截圖，原始照片可能不是同一天。</p><div class="postfoot"><span>留言 604</span><span>轉傳 271</span></div></div><div class="post"><div class="posttop"><strong>NATE PANN · 熱門</strong><span class="pill">爭議</span></div><p>我覺得這件事不應該靠猜測。沒有清楚證據之前，請不要把普通人的身影當成爆料素材。</p><div class="postfoot"><span>留言 1,092</span><span>轉傳 336</span></div></div><div class="post"><div class="posttop"><strong>INSTIZ · 談論區</strong><span class="pill">上升中</span></div><p>粉絲分成兩派：一派想知道真相，一派希望不要擴大。現在最重要的是查清楚照片從哪裡流出。</p><div class="postfoot"><span>留言 1,876</span><span>轉傳 522</span></div></div><div class="choicebox"><h3>你要如何處理網路輿論？</h3><button class="choice" onclick="socialChoice('quiet')"><span class="num">01</span>不參與討論，先查證原始線索。</button><button class="choice" onclick="socialChoice('defend')"><span class="num">02</span>用粉絲帳號留言，呼籲停止散播未證實消息。</button><button class="choice" onclick="socialChoice('leak')"><span class="num">03</span>匿名貼出自己找到的時間線。</button></div></div>`}
function socialChoice(k){if(k==='quiet'){state.exposure=Math.max(0,state.exposure-2);state.trust+=3;toast('你選擇先查證，曝光風險稍微降低。')}else if(k==='defend'){state.exposure+=4;state.trust+=2;toast('你的留言被大量轉傳，討論熱度上升。')}else{state.exposure+=17;state.trust-=8;toast('時間線被轉傳，輿論開始失控。')}if(!state.clues.includes('rumor'))state.clues.push('rumor');state.page='social';save();render()}
function notes(){return `${head('備忘錄','私人筆記 · 需要密碼的資料夾')}<div class="note"><h3>📌 重要事項</h3><p>1. 不要在公開群組討論今晚的事。\n2. 確認照片的原始建立時間。\n3. 找出是誰把後台照片傳到匿名論壇。\n4. 如果有人問起，先聯絡始源確認公關說法。\n\n—— 最後修改：今日 00:42</p></div><div class="note" style="background:#1b2434;border-color:#34465f;color:#d9e4f5"><h3>🔒 未完成的草稿</h3><p>「我不是不想公開，只是……」\n\n草稿沒有收件人，建立時間為 23:59。</p></div><div class="section"><div class="card"><div class="notif-title">你的線索清單</div><div class="small">${state.clues.length?state.clues.map((c,i)=>`${i+1}. ${escapeHtml(clueNames[c]||c)}`).join('<br>'):'尚未記錄線索。查看訊息、照片或行事曆後，線索會自動加入。'}</div></div><button class="primary" onclick="go('finale')">整理線索並推進事件</button></div>`}
const clueNames={leeteuk:'利特的求助訊息',silence:'暫時沒有回覆',handover:'交還手機',heechul:'希澈提到的照片',screenshot:'保存對話截圖',timestamp:'照片時間戳記',yesung:'藝聲的時間疑點',metadata:'原始檔與轉存紀錄',shindong:'神童的檔案建議',schedule:'未公開的私人行程',eunhyuk:'銀赫提到的行程',hiddenphoto:'相簿中的未公開照片',respect:'尊重東海的承諾',pr:'公關應對方案',rumor:'四大韓網爆料',emotion:'厲旭注意到的情緒',ryeowook:'厲旭的目擊線索',timeline:'行程時間線',contradiction:'兩段說法的矛盾',group:'群組對話',groupchat:'保存群組紀錄'};
function calls(){return `${head('通話紀錄','最近通話 · 7 筆')}<div class="chatlist">${[['利特','未接來電 · 手機震動 3 次','01:46'],['希澈','通話 02:18','23:16'],['始源','通話 00:42','22:04'],['未知號碼','未接來電','21:58'],['銀赫','通話 00:17','20:13']].map((x,i)=>`<div class="chatrow"><span class="avatar">${['特','澈','源','?','赫'][i]}</span><span class="chatmeta"><span class="chatname">${x[0]}</span><span class="preview">${x[1]}</span></span><span class="time">${x[2]}</span></div>`).join('')}</div><div class="section"><div class="card"><div class="notif-title">未接來電：利特</div><div class="small">在你撿到手機前 1 分鐘，利特曾連續撥打三次。你可以先查看他的訊息，再決定是否回撥。</div><button class="primary" onclick="openThread('leeteuk')">查看利特訊息</button></div></div>`}
function mail(){return `${head('郵件','收件匣 · 3 封未讀')}<div class="section"><div class="card"><div class="small">公司公關組 · 00:36</div><div class="notif-title">【內部】若出現私人行程照片的處理原則</div><p class="small">請勿轉傳未經確認的照片。若媒體詢問，先統一交由公關窗口處理。</p></div><div class="card"><div class="small">行程管理 · 23:41</div><div class="notif-title">明日行程更新</div><p class="small">早上 10:00 團體拍攝。凌晨時段的行程請勿公開。</p></div><div class="card"><div class="small">未署名 · 23:59</div><div class="notif-title">你不該把那張照片留下來</div><p class="small">這封郵件沒有附件，也沒有可追蹤的寄件資訊。</p></div></div>`}
function calendar(){return `${head('行事曆','10 月 23 日 · 私人行程')}<div class="section"><div class="card"><div class="small">20:00 — 21:30</div><div class="notif-title">團體練習</div><div class="small">全員 · 公司練習室</div></div><div class="card"><div class="small">22:00 — 22:40</div><div class="notif-title">行程空白</div><div class="small">這段時間沒有登記活動。</div></div><div class="card"><div class="small">23:00 — 23:30</div><div class="notif-title">私人行程（已隱藏）</div><div class="small">建立於 3 天前，最後修改時間 23:46。只有裝置持有人能查看詳細內容。</div></div><button class="primary" onclick="calendarChoice()">比對照片與行程時間</button></div>`}
function calendarChoice(){if(!state.clues.includes('schedule'))state.clues.push('schedule');if(!state.clues.includes('timeline'))state.clues.push('timeline');state.trust=Math.min(100,state.trust+4);toast('發現時間疑點：照片時間與團體練習重疊。');save();render()}
function files(){return `${head('檔案','最近使用 · 隱藏資料夾')}<div class="section"><div class="card"><div class="notif-title">IMG_2312_original.heic</div><div class="small">原始照片 · 4.8 MB · 建立時間 23:12</div><button class="subtlebtn" onclick="fileClue('metadata')">查看檔案資訊</button></div><div class="card"><div class="notif-title">schedule_private.txt</div><div class="small">文字檔 · 2 KB · 最後修改 23:46</div><button class="subtlebtn" onclick="fileClue('schedule')">查看檔案資訊</button></div><div class="card"><div class="notif-title">draft_untitled.txt</div><div class="small">未完成草稿 · 1 KB · 未同步</div><button class="subtlebtn" onclick="fileClue('draft')">查看檔案資訊</button></div></div>`}
function fileClue(c){if(!state.clues.includes(c))state.clues.push(c);toast('檔案資訊已記錄至調查。');save();render()}
function finale(){let enough=state.clues.length>=3;return `${head('線索整理','案件紀錄 · 初步分析')}<div class="section"><div class="statrow"><div class="stat"><label>信任</label><strong>${state.trust}%</strong><div class="meter"><i style="width:${state.trust}%"></i></div></div><div class="stat"><label>曝光風險</label><strong>${state.exposure}%</strong><div class="meter"><i style="width:${state.exposure}%;background:#d98eaa"></i></div></div><div class="stat"><label>線索數量</label><strong>${state.clues.length}</strong><div class="meter"><i style="width:${Math.min(100,state.clues.length*20)}%"></i></div></div></div><div class="card"><div class="notif-title">目前推論</div><p class="small">${enough?'你已找到多項可交叉比對的線索。照片時間與團體行程存在矛盾，匿名論壇的爆料也可能並非完整真相。':'目前證據不足。建議查看其他成員的訊息、相簿與行事曆，至少找到 3 項線索後再做決定。'}</p></div><div class="choicebox"><h3>下一步行動</h3><button class="choice" onclick="go('messages')">01　繼續查看成員訊息</button><button class="choice" onclick="go('photos')">02　回相簿檢查照片</button><button class="choice" onclick="go('social')">03　查看網路輿論變化</button><button class="choice" onclick="resolveCase('private')" ${!enough?'disabled style="opacity:.45"':''}>04　私下聯絡利特，保護當事人</button><button class="choice" onclick="resolveCase('public')" ${!enough?'disabled style="opacity:.45"':''}>05　將已確認的時間線交給公關</button></div></div>`}
function resolveCase(k){state.ending=k;state.stage=2;if(k==='private'){state.trust=Math.min(100,state.trust+8);state.exposure=Math.max(0,state.exposure-6)}else{state.exposure=Math.max(0,state.exposure-10);state.publicOpinion=Math.min(100,state.publicOpinion+5)}state.page='ending';save();render()}
function ending(){if(state.ending==='handover')return `${head('事件紀錄','序章分支')}<div class="ending"><div class="symbol">📵</div><div class="eyebrow">ENDING 00 · SAFE HANDOVER</div><h2>你選擇歸還手機</h2><p>工作人員接過手機，向你道謝。你沒有再看到那個人的訊息。<br>但當你走出場館時，陌生號碼傳來最後一則簡訊：<br><br>「謝謝妳沒有打開那個資料夾。」</p><button class="primary" onclick="resetGame()">重新開始</button><button class="primary" onclick="continueFree()">以新視角繼續探索</button></div>`;return `${head('新的訊息','私人裝置 · 01:59')}<div class="ending"><div class="symbol">✦</div><div class="eyebrow">CHAPTER 01 · TO BE CONTINUED</div><h2>${state.ending==='private'?'先保護秘密':'讓真相先被看見'}</h2><p>${state.ending==='private'?'你選擇私下聯絡利特。訊息已送出，幾秒後，手機亮起。\n\n「妳願意相信我嗎？有些事，我想親自跟妳解釋。」':'你把整理好的時間線交給公關。匿名爆料暫時降溫，但真正的照片來源仍然沒有答案。\n\n利特傳來訊息：「謝謝妳。還有一件事，我必須告訴妳。」'}<br><br>故事不會在這裡結束。新的對話、成員支線與隱藏檔案仍然可以探索。</p><div class="card" style="text-align:left"><div class="notif-title">目前狀態</div><div class="small">信任 ${state.trust}% · 曝光風險 ${state.exposure}% · 已發現線索 ${state.clues.length} 項</div></div><button class="primary" onclick="continueFree()">繼續自由探索</button><button class="primary" onclick="go('finale')">重新整理線索</button><button class="subtlebtn" style="margin-top:10px" onclick="resetGame()">重新開始遊戲</button></div>`}
function continueFree(){state.ending=null;state.page='home';state.thread=null;state.unlocked.messages=true;state.unlocked.photos=true;state.unlocked.social=true;state.unlocked.notes=true;state.unlocked.calls=true;state.unlocked.mail=true;state.unlocked.calendar=true;state.unlocked.files=true;save();render();toast('自由探索已開啟：所有 App 都可查看。')}
function resetGame(){localStorage.removeItem('anotherLifeSave');state={...initialState,unlocked:{...initialState.unlocked},clues:[],choices:[],read:{}};threads.leeteuk.msgs=[['other','妳到家了嗎？今天的事，先不要讓其他人知道。','01:47'],['me','你是誰？這支手機是我撿到的。','01:48'],['other','……撿到？妳現在在哪裡？','01:48'],['other','先不要交給工作人員。拜託。','01:49']];render()}
function addNote(t){if(!state.clues.includes('note:'+t))state.clues.push('note:'+t);save();toast('已新增備忘錄。')}
function render(){let p=state.page;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(p==='finale'||p==='ending')&&b.dataset.page==='home'));if(p==='home')screen.innerHTML=home();else if(p==='messages')screen.innerHTML=messages();else if(p==='photos')screen.innerHTML=photos();else if(p==='social')screen.innerHTML=social();else if(p==='notes')screen.innerHTML=notes();else if(p==='calls')screen.innerHTML=calls();else if(p==='mail')screen.innerHTML=mail();else if(p==='calendar')screen.innerHTML=calendar();else if(p==='files')screen.innerHTML=files();else if(p==='finale')screen.innerHTML=finale();else if(p==='ending')screen.innerHTML=ending();$('#statusTime').textContent=state.stage?'01:5'+Math.min(9,state.stage+1):'01:47';save()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});render();
</script></body></html>
